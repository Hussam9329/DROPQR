<!doctype html>
<html lang="en" data-force-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — DropQR</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/"><img class="brand-mark" src="/logo.svg" alt="" width="34" height="34">DropQR</a>
    <button class="btn btn-ghost" id="logout" type="button" hidden>Sign out</button>
  </header>

  <main>
    <section class="card admin-login" id="login">
      <h1>Admin</h1>
      <form id="login-form">
        <input type="password" id="secret" placeholder="Admin password" autocomplete="current-password" required>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
      <div class="error" id="login-error" role="alert"></div>
    </section>

    <section id="panel" hidden>
      <form class="admin-search" id="search-form">
        <input id="search" placeholder="Paste a link or file id to look it up">
        <button class="btn btn-ghost" type="submit">Find</button>
        <button class="btn btn-ghost" type="button" id="show-reported">Reported files</button>
      </form>
      <h2 class="admin-title" id="list-title">Reported files</h2>
      <div id="list"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
